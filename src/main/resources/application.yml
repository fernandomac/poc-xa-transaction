# XA Transaction POC — Base Configuration
# Profiles: fault (fault injection), benchmark (perf testing), test (Testcontainers)

server:
  tomcat:
    threads:
      max: 200
    accept-count: 200

spring:
  threads:
    virtual:
      enabled: true

  datasource:
    # URL includes XA-required parameters for MySQL Connector/J
    url: jdbc:mysql://localhost:3306/xapoc?allowXAStatements=true&pinGlobalTxToPhysicalConnection=true&useSSL=false&allowPublicKeyRetrieval=true
    username: xapoc
    password: xapoc

  jpa:
    hibernate:
      # create-drop is appropriate for a POC; use validate/none in production
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  artemis:
    mode: native
    broker-url: tcp://localhost:61616
    user: admin
    password: admin

  jta:
    enabled: true
    atomikos:
      properties:
        max-actives: 200
      datasource:
        unique-resource-name: mysqlXaDs
        max-pool-size: 100
        min-pool-size: 10
        borrow-connection-timeout: 5
        test-query: "SELECT 1"
      connectionfactory:
        unique-resource-name: artemisXaCf
        max-pool-size: 100
        min-pool-size: 10
        borrow-connection-timeout: 5
        local-transaction-mode: false

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        xa.transaction.duration: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
        xa.transaction.duration: 0.5, 0.95, 0.99

logging:
  level:
    com.atomikos: INFO
    com.example.xapoc: INFO
    org.springframework.transaction: INFO

# Application-specific properties
xa-poc:
  fault-injection:
    # Set to true via application-fault.yml profile to trigger XA rollback scenarios
    enabled: false
  benchmark:
    # Number of events per benchmark run; overridden to 100 in application-test.yml
    event-count: 1000
  # Admission control: max concurrent XA transactions in flight.
  # Beyond this limit, POST /api/events returns 503 immediately.
  # Rule of thumb: sustainable_rps × mean_latency_seconds (Little's Law).
  max-concurrent-transactions: 80
  consumer:
    # Set to false during producer-focused load tests to avoid consumer XA overhead.
    # Messages will accumulate in Artemis — safe for short test runs.
    enabled: true
  jms:
    # xa              — JMS send inside XA transaction (full 2PC, default)
    # non-transactional — JMS send after DB commit using plain connection (measures 2PC cost)
    # disabled        — no JMS send (DB-only baseline)
    mode: non-transactional
