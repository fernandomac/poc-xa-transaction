services:
  mysql:
    image: mysql:8.0
    platform: linux/amd64
    restart: unless-stopped
    command: >
      --max_connections=1000
      --innodb-flush-log-at-trx-commit=2
      --disable-log-bin
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: xapoc
      MYSQL_USER: xapoc
      MYSQL_PASSWORD: xapoc
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-xa-privileges.sql:ro
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: "2"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  artemis:
    image: apache/activemq-artemis:latest-alpine
    platform: linux/amd64
    restart: unless-stopped
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin
      ARTEMIS_MAX_MEMORY: 1536M
    ports:
      - "61616:61616"
      - "8161:8161"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://admin:admin@localhost:8161/console/jolokia/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 25s

  app:
    build:
      context: .
      dockerfile: Dockerfile.gcp
    platform: linux/amd64
    restart: on-failure
    ports:
      - "8080:8080"
    volumes:
      - atomikos_log:/app/atomikos-logs
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/xapoc?allowXAStatements=true&pinGlobalTxToPhysicalConnection=true&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: xapoc
      SPRING_DATASOURCE_PASSWORD: xapoc
      SPRING_ARTEMIS_BROKER_URL: tcp://artemis:61616
      SPRING_ARTEMIS_USER: admin
      SPRING_ARTEMIS_PASSWORD: admin
    depends_on:
      mysql:
        condition: service_healthy
      artemis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s

  prometheus:
    image: prom/prometheus:latest
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "0.5"
    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    depends_on:
      - prometheus

  gatling:
    image: maven:3.9-eclipse-temurin-17
    platform: linux/amd64
    profiles: ["gatling"]
    working_dir: /load-tests
    volumes:
      - ./load-tests:/load-tests
      - ./gatling-reports:/load-tests/target/gatling
      - maven_cache:/root/.m2
    environment:
      GATLING_PEAK_RPS: "${GATLING_PEAK_RPS:-5000}"
      GATLING_RAMP_SECONDS: "${GATLING_RAMP_SECONDS:-60}"
      GATLING_SUSTAIN_SECONDS: "${GATLING_SUSTAIN_SECONDS:-300}"
    command: >
      mvn gatling:test
        -Dgatling.baseUrl=http://app:8080
        -Dgatling.peakRps=${GATLING_PEAK_RPS:-5000}
        -Dgatling.rampSeconds=${GATLING_RAMP_SECONDS:-60}
        -Dgatling.sustainSeconds=${GATLING_SUSTAIN_SECONDS:-300}
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: "3"

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  maven_cache:
  atomikos_log:
    driver_opts:
      type: tmpfs
      device: tmpfs
